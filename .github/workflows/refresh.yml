name: Auto refresh index

on:
  push:
    branches: [main]      # push 到 main 触发
  workflow_dispatch:      # 手动触发

permissions:
  contents: write         # 自动 commit+push 回 main 需要

# 防并发：同一分支多个 push 并行时只保留最新，避免冲突 commit
concurrency:
  group: refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh index
        run: packwiz refresh

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "index up-to-date, no commit"
          else
            git commit -m "ci: auto refresh index"
            git push
            echo "pushed refresh commit"
          fi
